name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 24
          # Empty means the runner's own architecture.
        architecture: ${{ matrix.java-arch || '' }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

      # `build` runs `assemble` + `check` (which includes `test`). The Java
      # toolchain needed to compile is auto-provisioned by the foojay resolver.
    - name: Build and test
      run: ./gradlew build

    - name: Upload jar
      uses: actions/upload-artifact@v7
      with:
        name: zt-exec
        path: build/libs/*.jar
        retention-days: 7

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: build/reports/tests/
        retention-days: 7
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
